workflows:
  android-build:
    name: Build Android APK
    max_build_duration: 60
    instance_type: mac_mini_m1 # أو يمكنك استخدام linux للسرعة والتكلفة الأقل إذا أردت
    environment:
      groups:
        - android_credentials # يمكنك ربط متغيراتك السرية هنا في واجهة Codemagic
      vars:
        CM_JDK_VERSION: "17" # إعداد JDK 17 ليتوافق مع الإعدادات الخاصة بك
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Set up local properties and environment file
        script: |
          # إنشاء ملف .env فارغ أو تعبئته إذا كان مشروعك يعتمد عليه لتجنب أخطاء الـ Secrets Plugin
          touch .env
          echo "PROJECT_PROPERTY=example_value" >> .env
          
      - name: Set up JDK
        script: |
          jdk-switch --version $CM_JDK_VERSION

      - name: Grant execute permission for gradlew
        script: |
          chmod +x gradlew

      - name: Build Android APK
        script: |
          ./gradlew assembleDebug

    artifacts:
      - app/build/outputs/apk/debug/*.apk